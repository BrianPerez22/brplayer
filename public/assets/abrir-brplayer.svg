<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" role="img" aria-label="Abrir brplayer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Abrir brplayer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".55" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="ball" cx=".5" cy=".5" r=".5" fx=".42" fy=".38">
      <stop offset="0" stop-color="#ffbdcd"><animate attributeName="stop-color" values="#ffbdcd;#ffd3bd;#fff4bd;#bdffde;#bde9ff;#cdbdff;#ffbdff;#ffbdcd" dur="16s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff4d79"><animate attributeName="stop-color" values="#ff4d79;#ff884d;#ffe14d;#4dffa6;#4dc3ff;#794dff;#ff4dff;#ff4d79" dur="16s" repeatCount="indefinite"/></stop>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3366" stop-opacity=".55"><animate attributeName="stop-color" values="#ff3366;#ff7733;#ffdd33;#33ff99;#33bbff;#6633ff;#ff33ff;#ff3366" dur="16s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff3366" stop-opacity="0"><animate attributeName="stop-color" values="#ff3366;#ff7733;#ffdd33;#33ff99;#33bbff;#6633ff;#ff33ff;#ff3366" dur="16s" repeatCount="indefinite"/></stop>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="3" y="3" width="374" height="90" rx="45"/></clipPath>
  </defs>

  <!-- botón -->
  <rect x="3" y="3" width="374" height="90" rx="45" fill="url(#bg)" stroke="url(#bd)" stroke-width="3"/>

  <!-- destello que cruza el botón -->
  <g clip-path="url(#pill)">
    <rect x="-120" y="0" width="90" height="96" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;420;420" keyTimes="0;.35;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bolita (cambia de color y flota) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    <circle cx="58" cy="48" r="34" fill="url(#halo)"/>
    <circle cx="58" cy="48" r="25" fill="url(#ball)"/>
    <ellipse cx="50" cy="39" rx="7" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-30 50 39)"/>
  </g>

  <!-- texto -->
  <text x="104" y="46" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" textLength="206" lengthAdjust="spacingAndGlyphs">Abrir brplayer</text>
  <text x="105" y="68" fill="#8e8e93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-size="14" textLength="222" lengthAdjust="spacingAndGlyphs">Pruébalo en línea · sin instalar</text>

  <!-- flecha -->
  <g fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M341 36 L354 48 L341 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>

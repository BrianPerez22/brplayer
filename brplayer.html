<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>brplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Música">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#777;--card:#f1f1f4;--acc:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f2f2;--mut:#8e8e93;--card:#1c1c1e;--acc:#fb7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f2f2f2;--mut:#8e8e93;--card:#1c1c1e;--acc:#fb7185;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:0;border-radius:10px;padding:10px 14px}
header{display:flex;gap:8px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header input[type=search]{flex:1;min-width:0;background:var(--card);border:0;border-radius:10px;padding:10px}
#add{background:var(--acc);color:#fff;font-weight:600}
#list{padding:0 12px 330px}
.t{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--card)}
.t .i{flex:1;min-width:0}.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:var(--mut)}.t.on b{color:var(--acc)}
.t .x{background:none;color:var(--mut);padding:8px 12px}
#empty{text-align:center;color:var(--mut);padding:60px 20px;line-height:1.5}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;box-shadow:0 -2px 12px #0003}
#now{display:flex;gap:12px;align-items:center;margin-bottom:8px}
#cv{width:56px;height:56px;border-radius:8px;background:var(--bg);object-fit:cover;flex:none}
#nt{min-width:0}#nt b,#nt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#nt small{color:var(--mut)}
#seek{width:100%;accent-color:var(--acc)}
.tm{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.ct{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ct button{background:none;font-size:26px;padding:6px 12px}
.ct #pp{background:var(--acc);color:#fff;border-radius:50%;width:60px;height:60px;padding:0;font-size:26px}
.ct .on{color:var(--acc)}
.ex{display:flex;gap:8px;justify-content:space-between}
.ex select{background:var(--bg);border:0;border-radius:8px;padding:6px;flex:1;min-width:0}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;display:none;z-index:60;max-width:90%}
[hidden]{display:none!important}
:root{--ph:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgb(142,142,147)' stroke-width='1.6' stroke-linecap='round'><path d='M9 18V5l11-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='17' cy='16' r='3'/></svg>")}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
svg{display:block;flex:none}
.cv{object-fit:cover;background:var(--card) var(--ph) center/50% no-repeat;border-radius:8px;flex:none}
#cv{background-color:var(--bg);cursor:pointer}
.th{width:48px;height:48px}
.ib{background:none;padding:8px;color:var(--mut)}
#now .ib{flex:none}#nt{flex:1}
header #sortb{padding:10px 12px}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:12px;background:var(--card);border-radius:12px;box-shadow:0 6px 24px #0005;z-index:15;padding:6px;min-width:210px}
#menu button{display:flex;width:100%;justify-content:space-between;background:none;border-radius:8px;text-align:left}
#menu button:active{background:var(--bg)}
.ct .b-pp{background:var(--acc);color:#fff;border-radius:50%;width:60px;height:60px;padding:0}
.ct button{padding:8px 12px;position:relative}
.ct .on::after{content:"";position:absolute;bottom:0;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.ex{align-items:center}
#orb{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:1;height:44px;position:relative;background:var(--bg);border-radius:22px;overflow:hidden;cursor:pointer}
#ball{position:absolute;top:50%;left:12px;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:var(--acc);opacity:.45;transition:left .7s cubic-bezier(.34,1.56,.64,1),opacity .3s}
#orb.play #ball{opacity:1;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}50%{transform:scale(1.15);box-shadow:0 0 0 9px transparent}}
#fs{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
#fs .top{width:100%;display:flex;justify-content:space-between}
#fcv{width:min(88vw,46vh);aspect-ratio:1;border-radius:18px;box-shadow:0 12px 40px #0004}
#fs .meta{text-align:center;width:100%}#fs .meta b{display:block;font-size:22px}#fs .meta small{color:var(--mut);font-size:16px}
#fs .bt{width:100%;max-width:420px}#fs .ct button{padding:10px 14px}#fs .ct .b-pp{width:72px;height:72px}
.sk{width:100%;accent-color:var(--acc)}
#inf{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}
#inf .card{background:var(--bg);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#inf .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#inf dt{color:var(--mut);font-size:13px;margin-top:10px}#inf dd{margin:2px 0 0;word-break:break-word}
header{padding:14px 16px 10px;gap:10px;flex-wrap:wrap}
#tabs{flex-basis:100%;display:flex;gap:8px}
#tabs button{flex:1;padding:9px 6px;font-size:14px}
#tabs button.on{background:var(--acc);color:#fff}
#menu{top:calc(env(safe-area-inset-top,0px) + 66px)}
#list{padding:4px 16px 400px}
.t{padding:12px 4px;gap:12px}
#bar{padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px))}
#now{margin-bottom:14px;gap:12px}
#now .ib{padding:6px}
.ct{margin:14px 0}
.ex{gap:12px;margin-top:8px}
.tm{margin-top:4px}
.bar2{display:flex;align-items:center;gap:10px;padding:10px 0}.bar2 .sp{flex:1}.bar2 b{font-size:18px}
.plc{width:48px;height:48px;border-radius:8px;background:var(--card);display:grid;place-items:center;color:var(--mut);flex:none}
.ovl{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.ovl .card{background:var(--bg);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#sht{display:block;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{display:flex;width:100%;justify-content:flex-start;gap:14px;background:none;padding:14px 6px;border-radius:10px}
.sb:active{background:var(--card)}
header{gap:8px}
header button{padding:10px}#add{padding:10px 12px}
header input[type=search]{flex:1 1 0;min-width:80px}
#tabs button{font-size:13px;padding:9px 2px}
#ball{width:22px;height:22px;margin-top:-11px}
.cnt{color:var(--acc);font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.ci{flex:none;width:120px;scroll-snap-align:start;cursor:pointer}
.ci img{width:120px;height:120px;border-radius:12px}
.ci b,.ci small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci b{margin-top:6px;font-size:14px}.ci small{color:var(--mut)}

/* ---------- Visualizador ---------- */
#stage{flex:1;min-height:0;width:100%;max-width:min(92vw,860px);margin:10px 0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:18px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage.v{background:#000;box-shadow:0 12px 40px #0004}
#vz{position:absolute;inset:0;width:100%;height:100%;display:none}
#stage.v #vz{display:block}#stage.v #fcv{display:none}
#stage[data-crt]::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0005 2px 3px);box-shadow:inset 0 0 90px #000c}
#vlab{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:13px;padding:5px 12px;border-radius:20px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:3;white-space:nowrap}
#vlab.show{opacity:1}
#vhud{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:none;align-items:center;gap:2px;background:#000d;color:#fff;padding:6px 10px;border-radius:32px;z-index:3;opacity:0;transition:opacity .3s;pointer-events:none;max-width:94vw}
#vhud .ib{color:#fff;padding:8px}
#vhud .tx{min-width:110px;max-width:42vw;text-align:center;line-height:1.25}
#vhud .tx b,#vhud .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vhud .tx small{color:#ffffffa0;font-size:12px}
#fs.imm #vhud{display:flex}#fs.imm.hud #vhud{opacity:1;pointer-events:auto}
#fs.imm .top,#fs.imm .meta,#fs.imm .bt{display:none}
#fs.imm{padding:0}
#fs.imm #stage{position:absolute;inset:0;max-width:none;width:auto;margin:0;border-radius:0;box-shadow:none;z-index:2}
#fs.imm #vlab{top:calc(env(safe-area-inset-top,0px) + 78px)}
#fs.imm:not(.hud){cursor:none}
@media (max-height:520px){#fs .meta{display:none}}
/* marca de canción en reproducción (bolita plana, animación casi imperceptible) */
.t{position:relative}
.t.on::before{content:"";position:absolute;left:-11px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--acc);opacity:.85}
body.pl .t.on::before{animation:npl 10s ease-in-out infinite}
@keyframes npl{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:.98;transform:scale(1.05)}}
/* barra de progreso con animaciones */
.skw{position:relative;height:28px;width:100%}
.skc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.skw .sk{position:relative;z-index:1;display:block;width:100%;height:100%;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;outline:none}
.sk::-webkit-slider-runnable-track{height:16px;background:transparent;border:0}
.sk::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border:0;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
.sk::-moz-range-track{height:16px;background:transparent;border:0}
.sk::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
/* bolita de animaciones */
.orb{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;height:44px;position:relative;background:var(--card);border-radius:22px;overflow:hidden;cursor:pointer;width:100%;flex:none}
.orb .bl{position:absolute;top:50%;left:12px;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--acc);opacity:.45;transition:left .7s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.orb.play .bl{opacity:1;animation:pulse .9s ease-in-out infinite}
#fs .bt .orb{margin-top:6px}
#vhud .orb{width:96px;height:36px;background:#ffffff26;border-radius:18px}
#vhud .orb .bl{width:18px;height:18px;margin-top:-9px}
/* miniatura que se desvanece */
#vmini{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;display:none;align-items:center;gap:10px;background:#000d;color:#fff;padding:6px 14px 6px 6px;border-radius:14px;opacity:0;transition:opacity .7s;pointer-events:none;z-index:3;max-width:72vw}
#vmini img{width:48px;height:48px;border-radius:8px}
#vmini .tx{min-width:0}#vmini b,#vmini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#vmini small{color:#ffffffa0;font-size:12px}
#fs.imm #vmini{display:flex}#fs.imm.hud #vmini{opacity:1}
/* controles mínimos en la lista */
#bgrab{display:flex;justify-content:center;padding:6px 0 10px;margin-top:-10px;cursor:pointer}
#bgrab i{width:38px;height:5px;border-radius:3px;background:var(--mut);opacity:.5}
#bar.min{padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#bar.min #cv,#bar.min #now .ib,#bar.min .tm,#bar.min .ex,#bar.min .b-shuf,#bar.min .b-rep{display:none}
#bar.min #now{margin-bottom:4px}
#bar.min .ct{margin:6px 0 0;justify-content:center;gap:30px}
#bar.min .ct .b-pp{width:48px;height:48px}
body.bmin #list{padding-bottom:150px}

/* ---------- Efectos raros en inactividad (idle) ---------- */
:root{--m:0}
body[class*="fx-"] :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button){transform-origin:50% 0;animation-duration:7s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
body[class*="fx-"] :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button):nth-child(2n){--r:.7;animation-duration:9s;animation-delay:-3s}
body[class*="fx-"] :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button):nth-child(3n){--r:1.25;animation-duration:6s;animation-delay:-1.5s}
body[class*="fx-"] :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button):nth-child(5n){--r:.5;animation-duration:11s;animation-delay:-5s}
body.fx-melt :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button){animation-name:fxm;text-shadow:0 calc(var(--m)*var(--r,1)*4px) calc(var(--m)*3px) currentColor}
body.fx-melt :is(.t b,.t small,.ci b,.ci small,.bar2 b){filter:blur(calc(var(--m)*.7px))}
@keyframes fxm{
 0%,100%{transform:translateY(calc(var(--m)*var(--r,1)*2px)) scale(1,calc(1 + var(--m)*var(--r,1)*.2)) skewX(calc(var(--m)*-1.5deg))}
 50%{transform:translateY(calc(var(--m)*var(--r,1)*6px)) scale(calc(1 + var(--m)*.02),calc(1 + var(--m)*var(--r,1)*.5)) skewX(calc(var(--m)*1.5deg))}}
body.fx-lsd :is(.t b,.t small,.t .cnt,.t .cv,.t .ib,.t .x,.plc,.bar2 b,.bar2 button,.ci b,.ci small,.ci img,#empty,header input,header button){animation-name:fxl;text-shadow:calc(var(--m)*-2px) 0 rgba(255,0,140,calc(var(--m)*.55)),calc(var(--m)*2px) 0 rgba(0,210,255,calc(var(--m)*.55))}
body.fx-lsd :is(.t .cv,.ci img){filter:hue-rotate(calc(var(--m)*45deg)) saturate(calc(1 + var(--m)*.5))}
@keyframes fxl{
 0%,100%{transform:translate(0,0) rotate(0) scale(1)}
 25%{transform:translate(calc(var(--m)*var(--r,1)*3px),calc(var(--m)*var(--r,1)*-2px)) rotate(calc(var(--m)*var(--r,1)*1.8deg)) scale(calc(1 + var(--m)*.05))}
 50%{transform:translate(calc(var(--m)*var(--r,1)*-2px),calc(var(--m)*var(--r,1)*3px)) rotate(calc(var(--m)*var(--r,1)*-1.4deg)) scale(calc(1 - var(--m)*.04))}
 75%{transform:translate(calc(var(--m)*var(--r,1)*-3px),calc(var(--m)*var(--r,1)*-1px)) rotate(calc(var(--m)*var(--r,1)*2.2deg)) scale(calc(1 + var(--m)*.06))}}
#pxo{position:fixed;left:0;top:0;z-index:19;pointer-events:none;opacity:0;transition:opacity 1.2s}
#pxo.on{opacity:1}#pxo.off{transition-duration:.45s}

#bar{z-index:20}
header #hb{padding:10px 12px;flex:none}#tabs #sortb{flex:none;padding:9px 12px}
#menu{top:calc(env(safe-area-inset-top,0px) + 112px)}
#hm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:12px;background:var(--card);border-radius:12px;box-shadow:0 6px 24px #0005;z-index:15;padding:6px;min-width:230px}
#hm button{display:flex;width:100%;justify-content:flex-start;gap:12px;background:none;border-radius:8px;text-align:left}#hm button:active{background:var(--bg)}
/* ---------- Botones squishy ---------- */
button:not(:disabled),[data-a],.bd .th{transition:transform .6s cubic-bezier(.3,2.2,.5,1)}
button:not(:disabled):active,[data-a]:active{transform:scale(1.16,.8);transition-duration:.07s}
.ct .b-pp:active{transform:scale(1.22,.78)}
@media (prefers-reduced-motion:reduce){button:not(:disabled):active,[data-a]:active{transform:none}}
/* ---------- Ecualizador / 3D ---------- */
#eq .card{max-width:520px;max-height:88vh}
#eq .mh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
#eq canvas{width:100%;display:block;background:var(--card);border-radius:12px}
#eqc{height:90px}#spr{height:150px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;font-size:13px;border-radius:16px}.chip.on{background:var(--acc);color:#fff}
#eqb{display:flex;justify-content:space-between;gap:2px;height:170px;margin:6px 0 12px}
.bd{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);touch-action:none;user-select:none;cursor:pointer}
.bd .tr{flex:1;width:34px;position:relative}
.bd .tr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:var(--card)}
.bd .th{position:absolute;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--acc);box-shadow:0 2px 8px #0004}
.bd:active .th{transform:scale(1.3,.78)}
.tg{width:50px;height:28px;border-radius:14px;padding:0;position:relative;background:var(--card)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .5s cubic-bezier(.3,2.2,.5,1),width .2s}
.tg.on{background:var(--acc)}.tg.on::after{left:25px;background:#fff}
#sps label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:6px 0}#sps label span{width:78px}#sps input{flex:1;accent-color:var(--acc)}#sps .dis{opacity:.35}

/* asa para minimizar/expandir: zona táctil grande (también por encima de la barra) y gesto de deslizar */
#bgrab{position:relative;padding:16px 0 14px;margin-top:-22px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bgrab::before{content:"";position:absolute;left:0;right:0;top:-18px;bottom:0}
#bgrab i{width:48px;height:6px}

/* gestos de deslizar en la lista */
#list{touch-action:pan-y}
.t.sw::after{content:"+ Cola";position:absolute;left:-96px;top:0;bottom:0;width:84px;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:600;font-size:14px}
.t.qa{animation:qa .8s ease-out}
@keyframes qa{0%{background:color-mix(in srgb,var(--acc) 32%,transparent)}100%{background:transparent}}
#list.slL{animation:slL .35s cubic-bezier(.2,.8,.3,1)}#list.slR{animation:slR .35s cubic-bezier(.2,.8,.3,1)}
@keyframes slL{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}

<script>
const $=id=>document.getElementById(id);
const au=$('au');
let loading=true,errN=0,tracks=[],cur=-1,shuffle=false,repeat=0,url=null,hist=[],shufQ=null,dragging=false,restore=null,sortKey=localStorage.getItem('sort')||'name-asc';
const MIME={mp3:'audio/mpeg',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg; codecs=opus',aif:'audio/aiff',aiff:'audio/aiff',caf:'audio/x-caf'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}

/* ---------- Almacenamiento (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('player',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('t',mode);const r=fn(t.objectStore('t'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};

/* ---------- Biblioteca del servidor ---------- */
const pd=v=>{if(!v)return 0;if(typeof v=='number')return v<1e12?v*1000:v;const d=Date.parse(v);return isNaN(d)?0:d};
function splitName(n){const b=n.replace(/\.[^.]+$/,'');const k=b.indexOf(' - ');return k>0?{artist:b.slice(0,k).trim(),title:b.slice(k+3).trim()}:{artist:'',title:b}}
let tagc={};try{tagc=JSON.parse(localStorage.getItem('tagc')||'{}')}catch(e){}
let tagSv=0;
function noteTags(t){if(!t.remote)return;tagc[t.name]=[t.title,t.artist||'',t.album||'',t.trk||0];clearTimeout(tagSv);tagSv=setTimeout(()=>{try{localStorage.setItem('tagc',JSON.stringify(tagc))}catch(e){}},1500)}
async function loadServer(){
  let j;
  try{const r=await fetch('/api/canciones',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json();try{localStorage.setItem('srvlist',JSON.stringify(j))}catch(e){}}
  catch(e){j=JSON.parse(localStorage.getItem('srvlist')||'null');if(!j)throw e}
  return j.map(s=>{const n=splitName(s.nombre);
    const o={id:'srv:'+s.nombre,remote:true,name:s.nombre,url:s.url,title:n.title,artist:n.artist,album:'',cover:null,date:pd(s.fecha||s.date||s.mtime||s.modificado||s.modified),size:s.size||s.tamano||0};
    const c=tagc[s.nombre];if(c){o.title=c[0]||o.title;o.artist=c[1]||o.artist;o.album=c[2]||'';o.trk=c[3]||0;o.tc=1}
    return o});
}
/* Lee etiquetas y carátula de la canción actual pidiendo solo los primeros 2 MB */
function remoteTags(t){return t.tagsP||(t.tagsP=_remoteTags(t))}
async function _remoteTags(t){
  if(t.tagsDone)return;t.tagsDone=true;
  try{
    let b=null;
    if(window.caches){try{const m=await caches.match(t.url);if(m){const fb=await m.blob();if(!t.size)t.size=fb.size;b=fb.slice(0,2097152)}}catch(e){}}
    if(!b){
      const ctl=new AbortController();
      const r=await fetch(t.url,{headers:{Range:'bytes=0-2097151'},signal:ctl.signal});
      const cr=/\/(\d+)$/.exec(r.headers.get('content-range')||'');if(cr)t.size=+cr[1];
      const lm=Date.parse(r.headers.get('last-modified')||'');if(lm&&!t.date)t.date=lm;
      t.mime=t.mime||r.headers.get('content-type')||'';
      if(r.status!==206){ctl.abort();return}
      b=await r.blob();
    }
    const tg=await readTags(new File([b],t.name));
    const fn=t.name.replace(/\.[^.]+$/,'');
    if(tg.title&&tg.title!==fn)t.title=tg.title;
    if(tg.artist)t.artist=tg.artist;
    if(tg.album)t.album=tg.album;
    if(tg.cover)t.cover=tg.cover;
    if(tg.meta)t.meta=tg.meta;
    {const m=tg.meta||{};t.trk=parseInt(String(m['Pista']||m['TRACKNUMBER']||'').split('/')[0])||0}
    t.tc=1;noteTags(t);
  }catch(e){t.tagsDone=false;t.tagsP=null}
}

/* ---------- Etiquetas (ID3 / FLAC) ---------- */
const dec=(b,enc)=>{try{let l='windows-1252';if(enc==3)l='utf-8';else if(enc==2)l='utf-16be';else if(enc==1){if(b[0]==0xFE&&b[1]==0xFF){l='utf-16be';b=b.subarray(2)}else{l='utf-16le';if(b[0]==0xFF&&b[1]==0xFE)b=b.subarray(2)}}return new TextDecoder(l).decode(b).replace(/\0/g,'').trim()}catch(e){return''}};
function parseID3(b,ver,t){
  let p=10;(t.meta=t.meta||{})['Etiquetas']='ID3v2.'+ver;
  while(p+10<b.length){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(b[p]==0)break;
    const sz=ver==4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;
    const d=b.subarray(p+10,p+10+sz);p+=10+sz;
    if(id=='TIT2')t.title=dec(d.subarray(1),d[0])||t.title;
    else if(id=='TPE1')t.artist=dec(d.subarray(1),d[0]);
    else if(id=='TALB')t.album=dec(d.subarray(1),d[0]);
    else if(id[0]=='T'&&FR[id]){t.meta[FR[id]]=dec(d.subarray(1),d[0])}
    else if(id=='APIC'&&!t.cover){
      const enc=d[0];let i=1;while(i<d.length&&d[i])i++;const mime=String.fromCharCode(...d.subarray(1,i));i+=2;
      if(enc==1||enc==2){while(i<d.length-1&&!(d[i]==0&&d[i+1]==0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
      t.cover=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/jpeg'});
    }
  }
}
async function parseFlac(f,t){
  let p=4,last=false;
  while(!last&&p<f.size){
    const h=new Uint8Array(await f.slice(p,p+4).arrayBuffer());last=h[0]>>7;const ty=h[0]&127,len=(h[1]<<16)|(h[2]<<8)|h[3];p+=4;
    if((ty==0||ty==4||ty==6)&&len<12e6){
      const b=new Uint8Array(await f.slice(p,p+len).arrayBuffer()),v=new DataView(b.buffer);
      if(ty==0){const m=t.meta=t.meta||{};m['Frecuencia']=((b[10]<<12)|(b[11]<<4)|(b[12]>>4))+' Hz';m['Canales']=((b[12]>>1)&7)+1;m['Bits por muestra']=(((b[12]&1)<<4)|(b[13]>>4))+1;m['Etiquetas']='FLAC (Vorbis)'}
      else if(ty==4){
        let o=4+v.getUint32(0,true);const n=v.getUint32(o,true);o+=4;
        for(let k=0;k<n&&o<b.length;k++){const l=v.getUint32(o,true);o+=4;const s=new TextDecoder().decode(b.subarray(o,o+l));o+=l;const e=s.indexOf('=');if(e<0)continue;const key=s.slice(0,e).toUpperCase(),val=s.slice(e+1);
          if(key=='TITLE')t.title=val;else if(key=='ARTIST')t.artist=val;else if(key=='ALBUM')t.album=val;else(t.meta=t.meta||{})[key]=val}
      }else if(!t.cover){
        let o=4;const ml=v.getUint32(o);o+=4;const mime=new TextDecoder().decode(b.subarray(o,o+ml));o+=ml;const dl=v.getUint32(o);o+=4+dl+16;const il=v.getUint32(o);o+=4;
        t.cover=new Blob([b.slice(o,o+il)],{type:mime||'image/jpeg'});
      }
    }
    p+=len;
  }
}
async function readTags(f){
  const t={title:f.name.replace(/\.[^.]+$/,''),artist:'',album:'',cover:null};
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]==0x49&&h[1]==0x44&&h[2]==0x33){
      const size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
      parseID3(new Uint8Array(await f.slice(0,10+Math.min(size,12e6)).arrayBuffer()),h[3],t);
    }else if(h[0]==0x66&&h[1]==0x4C&&h[2]==0x61&&h[3]==0x43)await parseFlac(f,t);
  }catch(e){}
  return t;
}
async function artURL(blob,mx=512){
  if(!blob)return null;
  try{
    const bm=await createImageBitmap(blob);
    const s=Math.min(1,mx/Math.max(bm.width,bm.height)),W=Math.max(1,Math.round(bm.width*s)),H=Math.max(1,Math.round(bm.height*s));
    /* reducción por mitades + suavizado alto: evita el aspecto borroso/dentado al achicar mucho */
    let src=bm,sw=bm.width,sh=bm.height;
    while(sw/2>=W&&sh/2>=H){const c=document.createElement('canvas');sw=c.width=Math.round(sw/2);sh=c.height=Math.round(sh/2);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,sw,sh);src=c}
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,W,H);
    if(bm.close)bm.close();
    return c.toDataURL('image/jpeg',.9);
  }catch(e){return null}
}

/* ---------- Iconos ---------- */
const P={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',eq:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',shuf:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',prev:'<path d="M6 5v14"/><path d="M19 5v14L8 12z" fill="currentColor"/>',next:'<path d="M18 5v14"/><path d="M5 5v14l11-7z" fill="currentColor"/>',play:'<path d="M7 4v16l13-8z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="4"/>',rep:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',rep1:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="m11 10 1-1v6"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',sort:'<path d="M4 7h9M4 12h6M4 17h3M17 5v14m0 0-3-3m3 3 3-3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',down:'<path d="m6 9 6 6 6-6"/>',dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 5 5 9-10"/>',more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.9 7.6-3.8M8.2 13.1l7.6 3.8"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',back:'<path d="m15 6-6 6 6 6"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',viz:'<path d="M4 20v-7M8 20V5M12 20v-10M16 20V3M20 20v-9"/>',full:'<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>',next2:'<path d="m9 6 6 6-6 6"/>',heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',heartf:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="currentColor"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',disc:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',dl:'<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>'};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const FR={TPE2:'Artista del álbum',TRCK:'Pista',TPOS:'Disco',TYER:'Año',TDRC:'Año',TCON:'Género',TCOM:'Compositor',TPUB:'Editorial',TENC:'Codificado por',TSSE:'Software',TBPM:'BPM',TKEY:'Tonalidad',TLAN:'Idioma',TCOP:'Copyright',TDAT:'Fecha',TIT3:'Subtítulo',TOPE:'Artista original'};
const GIF='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const fsz=b=>(b>=1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB')+' ('+b.toLocaleString('es')+' bytes)';
const sub=t=>[t.artist,t.album].filter(Boolean).join(' · ')||t.name;
/* artista y álbum son tocables: abren su página */
const subH=t=>{const p=[];if(t.artist)p.push(`<span class="lk" data-ar="${esc(t.artist)}">${esc(t.artist)}</span>`);if(t.album)p.push(`<span class="lk" data-al="${esc(t.album)}">${esc(t.album)}</span>`);return p.length?p.join(' · '):esc(t.name)};
const cdH=t=>offOn&&t.cached?`<span class="cd">${ic('dl',13)}</span>`:'';

/* ---------- Cola de tareas (carátulas y etiquetas) ---------- */
const Q=[];let busy=0;
function qadd(fn,front){front?Q.unshift(fn):Q.push(fn);pump()}
function pump(){while(busy<3&&Q.length){busy++;Q.shift()().catch(()=>{}).finally(()=>{busy--;pump()})}}
function ensureThumb(t,front){
  if(t.th)return;t.th=1;
  qadd(async()=>{
    if(t.remote)await remoteTags(t);
    if(t.cover&&!t.thumb)t.thumb=await artURL(t.cover,160);
    updRow(t);if(tracks[cur]===t)updateNow();
  },front);
}
/* versión grande (360 px) para el carrusel de Recientes: se hace solo para las que se muestran ahí */
function wantBig(t){
  if(t.thumbL||t.thB)return;t.thB=1;
  qadd(async()=>{
    if(t.remote)await remoteTags(t);
    if(t.cover&&!t.thumbL)t.thumbL=await artURL(t.cover,360);
    updRow(t);
  },true);
}
async function remoteHead(t){
  if(t.headDone||(t.date&&t.size))return;t.headDone=1;
  try{const r=await fetch(t.url,{method:'HEAD'});if(!r.ok)return;
    const l=+r.headers.get('content-length');if(l&&!t.size)t.size=l;
    const m=Date.parse(r.headers.get('last-modified')||'');if(m&&!t.date)t.date=m;
    t.mime=t.mime||r.headers.get('content-type')||''}catch(e){}
}

/* ---------- Añadir archivos ---------- */
$('file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';let n=0;
  for(const f of files){
    if(tracks.some(t=>t.name==f.name&&t.size==f.size))continue;
    toast(`Importando ${++n}/${files.length}…`);
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const blob=new Blob([f],{type:MIME[ext]||f.type||'audio/mpeg'});
    const tg=await readTags(f);
    const rec={name:f.name,size:f.size,blob,title:tg.title,artist:tg.artist,album:tg.album,cover:tg.cover,meta:tg.meta,date:f.lastModified,mime:blob.type};
    try{rec.id=await tx('readwrite',s=>s.add(rec))}catch(err){rec.id=Date.now()+Math.random();toast('No se pudo guardar; solo en esta sesión')}
    tracks.push(rec);if(shufQ)shufQ.splice(Math.random()*(shufQ.length+1)|0,0,rec);
    sortTracks();render();
  }
  toast(n?'Listo: '+n+' canción(es)':'Ya estaban añadidas');
  if(cur<0&&tracks.length)load(0,false);
};

async function delTrack(i){

/* ---------- Reproducción ---------- */
let loadTok=0;
async function load(i,play,push=true){
  if(i<0||i>=tracks.length)return;
  const t=tracks[i],tok=++loadTok;seekUntil=0;clearTimeout(seekTm);restoreR=null;
  if(push&&cur>=0&&cur!=i){hist.push(tracks[cur]);if(hist.length>200)hist.shift()}
  if(shufQ)shufQ=shufQ.filter(x=>x!==t);
  cur=i;
  if(url){URL.revokeObjectURL(url);url=null}
  let src=t.url;
  if(t.remote){
    if(window.caches){try{const m=await caches.match(t.url);if(m){const u=URL.createObjectURL(await m.blob());if(tok!==loadTok){URL.revokeObjectURL(u);return}url=u;src=u;t.cached=1}}catch(e){}}
    if(tok!==loadTok)return;
  }else{url=URL.createObjectURL(t.blob);src=url}
  au.src=src;au.loop=repeat==2;counted=false;
  if(play){const p=au.play();if(p)p.catch(()=>{})}
  render();await updateNow();
  const el=document.querySelector('.t.on');if(el&&play)el.scrollIntoView({block:'nearest'});
  try{history.replaceState(null,'','#'+new URLSearchParams({c:t.name}))}catch(e){}
  localStorage.setItem('last',t.id);
  t.th=0;ensureThumb(t,true);schedOff();
  setTimeout(()=>{if(tracks[cur]!==t)return;const n=peek();(n?cacheTrack(n):Promise.resolve()).then(()=>tracks[cur]===t&&cacheTrack(t))},1500);
}
async function updateNow(){
  const t=tracks[cur];
  const tt=t?t.title:'Sin reproducción',ta=t?subH(t):esc(loading?'Cargando biblioteca…':'Elige una canción');
  $('tt').textContent=$('ftt').textContent=tt;$('ta').innerHTML=$('fta').innerHTML=ta;syncFav();
  const a=t?await artURL(t.cover):null;
  if(tracks[cur]!==t)return;
  $('cv').src=$('fcv').src=a||GIF;
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=t?new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:a?[{src:a,sizes:'512x512',type:'image/jpeg'}]:[]}):null;
  }
}
/* Aleatorio: ronda sin repeticiones; Repetir: 0 no, 1 lista, 2 canción */
function mkQ(){const a=tracks.filter(t=>t!==tracks[cur]);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}shufQ=a}
function pick(auto){
  const n=tracks.length;if(!n)return -1;
  while(queue.length){const q=queue.shift(),k=tracks.indexOf(q);if(k>=0){qchg();return k}}
  if(plCtx&&!repeat){const r=plRandom();if(r){rndNext=null;if(!plCtx.done){plCtx.done=true;toast('Lista terminada: sigue música aleatoria')}return tracks.indexOf(r)}}
  if(plCtx&&repeat==1){const a=plTracks(plCtx.id);if(a.length){queue=a.slice(1);qchg();return tracks.indexOf(a[0])}}
  if(shuffle&&n>1){
    if(shufQ)shufQ=shufQ.filter(t=>tracks.includes(t)&&t!==tracks[cur]);
    if(!shufQ||!shufQ.length){if(shufQ&&auto&&!repeat)return -1;mkQ()}
    return tracks.indexOf(shufQ.shift());
  }
  let i=cur+1;
  if(i>=n){if(repeat==1||!auto)i=0;else return -1}
  return i;
}
function next(auto){
  const i=pick(auto);
  if(i<0){au.pause();if(!shuffle)load(0,false);return}
  load(i,true);
}
function prev(){
  if(au.currentTime>3){au.currentTime=0;return}
  while(hist.length){const t=hist.pop(),i=tracks.indexOf(t);if(i>=0){load(i,true,false);return}}
  load(cur>0?cur-1:tracks.length-1,true,false);
}
function toggle(){
  if(cur<0&&tracks.length){load(0,true);return}
  if(au.paused){const p=au.play();if(p)p.catch(()=>{})}else au.pause();
}
function rand(){
  if(!tracks.length)return;plCtx=null;rndNext=null;
  let n=0;if(tracks.length>1)do{n=Math.random()*tracks.length|0}while(n==cur);
  load(n,true);
}

/* ---------- Línea de tiempo ----------
   Antes el salto dependía solo del evento `change` del input: no se dispara si sueltas en el mismo valor o se
   interrumpe el gesto, y `dragging` quedaba en true (barra y tiempo congelados). Ahora el gesto se gestiona con
   pointer events: tocar la pista salta, arrastrar la bolita desplaza, y siempre se cierra al soltar/cancelar. */
const SKS=[...document.querySelectorAll('.sk')];
let dragT=0,seekUntil=0,seekTm=0,restoreR=null,seekFixing=0;
const okDur=d=>isFinite(d)&&d>0;
function syncSk(){const d=au.duration,v=okDur(d)?au.currentTime/d*1000:0;SKS.forEach(s=>{s.value=v;s.style.setProperty('--p',v/10+'%')});const x=fmt(au.currentTime);document.querySelectorAll('.tc').forEach(s=>s.textContent=x)}
function skUI(v){SKS.forEach(s=>{s.value=v;s.style.setProperty('--p',v/10+'%')});if(okDur(au.duration)){const x=fmt(v/1000*au.duration);document.querySelectorAll('.tc').forEach(s=>s.textContent=x)}try{SKFX.once()}catch(e){}}
const inSeek=x=>{const r=au.seekable;for(let i=0;i<r.length;i++)if(x>=r.start(i)-.5&&x<=r.end(i)+.5)return true;return false};
function seekTo(sec){
  const t=tracks[cur];if(!t||!isFinite(sec))return;
  const d=au.duration;sec=okDur(d)?Math.min(Math.max(0,sec),Math.max(0,d-.25)):Math.max(0,sec);
  /* servidor sin soporte de rangos: el navegador no puede saltar a lo no descargado -> se baja el archivo y se continúa desde ahí */
  if(t.remote&&!url&&au.readyState>=1&&!inSeek(sec)){seekFix(t,sec);return}
  seekUntil=performance.now()+1500;
  try{au.currentTime=sec}catch(e){}
  pos();clearTimeout(seekTm);let n=0;
  const chk=()=>{if(tracks[cur]!==t||au.loop||au.ended)return;
    if(au.seeking&&n++<3){seekTm=setTimeout(chk,1200);return}
    if(Math.abs(au.currentTime-sec)>4&&!inSeek(sec))seekFix(t,sec);else syncSk()};
  seekTm=setTimeout(chk,1200);
}
async function seekFix(t,sec){
  if(!t.remote||url||seekFixing)return;seekFixing=1;const was=!au.paused;
  try{
    toast('Descargando la canción para poder saltar…');
    if(caching.has(t)){while(caching.has(t))await new Promise(r=>setTimeout(r,300))}else await cacheTrack(t);
    if(tracks[cur]!==t)return;
    const m=window.caches&&await caches.match(t.url);
    if(!m){toast('El servidor no permite saltar en esta canción');syncSk();return}
    const u=URL.createObjectURL(await m.blob());
    if(tracks[cur]!==t||url){URL.revokeObjectURL(u);return}

function scanTags(){

  scanning=1;scanDone=0;scanTot=todo.length;toast('Leyendo datos de '+todo.length+' canciones…');
  todo.forEach(t=>{t.scn=1;qadd(async()=>{
    try{
      await remoteTags(t);
      if(t.cover&&!t.thumb)t.thumb=await artURL(t.cover,160);
      t.th=1;
      /* se suelta la carátula grande para no llenar la memoria; se vuelve a leer si la canción suena */
      if(tracks[cur]!==t&&t.cover&&t.thumb){t.cover=null;t.tagsDone=false;t.tagsP=null}
    }finally{
      updRow(t);scanDone++;
      if(scanDone>=scanTot){scanning=0;clearTimeout(scanTm);scanTm=0;toast('Datos de canciones listos');afterScan()}
      else if(!scanTm)scanTm=setTimeout(()=>{scanTm=0;afterScan()},1500);

        const R=document.documentElement,cs=getComputedStyle(R);W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
        const pr=document.createElement('div');pr.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)';document.body.appendChild(pr);
        const pc=getComputedStyle(pr),it=pc.paddingTop,ib=pc.paddingBottom;pr.remove();
        const css=document.querySelector('style').textContent.replace(/env\(safe-area-inset-top,0px\)/g,it).replace(/env\(safe-area-inset-bottom,0px\)/g,ib).replace(/:root/g,'html');
        const h=R.cloneNode(true);const hd=h.querySelector('head');if(hd)hd.remove();
        h.querySelectorAll('script,audio,#file').forEach(e=>e.remove());
        /* canvas -> imagen (barra de progreso, visualizador) */
        const A=[...document.querySelectorAll('canvas:not(#pxo)')],B=[...h.querySelectorAll('canvas:not(#pxo)')];
        A.forEach((c,i)=>{const b=B[i];if(!b)return;if(!c.offsetWidth){return}
          try{const m=document.createElement('img');m.className=c.className;m.id=c.id;m.setAttribute('src',c.toDataURL('image/png'));b.replaceWith(m)}catch(e){}});
        h.querySelectorAll('#bar,#fs').forEach(e=>e.remove());
        const po=h.querySelector('#pxo');if(po)po.remove();
        const AI=[...document.querySelectorAll('input:not(#file)')],BI=[...h.querySelectorAll('input:not(#file)')];
        AI.forEach((a,i)=>{if(BI[i])BI[i].setAttribute('value',a.value)});
        /* solo se conservan las filas visibles; las demás quedan como espacio vacío del mismo alto */
        const L=document.getElementById('list'),cl=h.querySelector('#list');
        if(L&&cl)[...L.children].forEach((ch,i)=>{const r=ch.getBoundingClientRect();if(r.bottom<-40||r.top>H+40){const sp=document.createElement('div');sp.style.height=r.height+'px';if(cl.children[i])cl.children[i].replaceWith(sp)}});
        if(cl)cl.style.marginTop=(-scrollY)+'px';
        const vars=['--bg','--fg','--mut','--card','--acc'].map(v=>v+':'+cs.getPropertyValue(v).trim()).join(';');
        h.setAttribute('style',vars+';color-scheme:'+cs.colorScheme+';box-sizing:border-box;padding-top:'+it+';padding-bottom:'+ib+';width:'+W+'px;height:'+H+'px;overflow:hidden');
        const st=document.createElement('style');st.textContent=css;h.insertBefore(st,h.firstChild);
        const xml=new XMLSerializer().serializeToString(h).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'');
        const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.round(W*dpr)+'" height="'+Math.round(H*dpr)+'" viewBox="0 0 '+W+' '+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'+xml+'</foreignObject></svg>';
        const m=new Image();m.onload=()=>res(m);m.onerror=()=>rej(new Error('snap'));
        m.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

    });
  }
  function paint(){
    if(!im||!cv)return;
    const p=Math.min(1,(performance.now()-t0)/DUR),b=1+(MAXB-1)*Math.pow(p,1.5),bd=b*dpr;
    const tw=Math.max(1,Math.round(cv.width/bd)),th=Math.max(1,Math.round(cv.height/bd));
    let cur=im,cw=cv.width,ch=cv.height,k=0;
    while(cw/2>=tw&&ch/2>=th){const nw=Math.ceil(cw/2),nh=Math.ceil(ch/2),c=tc(k++%2,nw,nh),x=c.getContext('2d');x.clearRect(0,0,nw,nh);x.imageSmoothingQuality='high';x.drawImage(cur,0,0,cw,ch,0,0,nw,nh);cur=c;cw=nw;ch=nh}
    const s=tc(2,tw,th),sx=s.getContext('2d');sx.clearRect(0,0,tw,th);sx.imageSmoothingQuality='high';sx.drawImage(cur,0,0,cw,ch,0,0,tw,th);
    ox.imageSmoothingEnabled=false;ox.clearRect(0,0,cv.width,cv.height);ox.drawImage(s,0,0,tw,th,0,0,tw*bd,th*bd);
  }
  function tick(){
    if(!run)return;paint();const n=performance.now();
    if(n-snapT>1500&&!busy){busy=1;snapT=n;snap().then(i=>{if(run)im=i}).catch(()=>{}).finally(()=>busy=0)}
    tmr=setTimeout(tick,150);
  }
  async function start(speed=1){
    run=1;DUR=55000/speed;
    try{im=await snap()}catch(e){run=0;return false}
    if(!run)return true;
    cv=document.createElement('canvas');cv.id='pxo';cv.width=im.width;cv.height=im.height;cv.style.width=W+'px';cv.style.height=H+'px';
    document.body.appendChild(cv);ox=cv.getContext('2d');t0=snapT=performance.now();paint();
    requestAnimationFrame(()=>requestAnimationFrame(()=>cv&&cv.classList.add('on')));tick();return true;
  }
  function stop(){
    if(!run)return;run=0;clearTimeout(tmr);const c=cv;cv=null;im=null;
    if(c){c.classList.add('off');c.classList.remove('on');setTimeout(()=>c.remove(),700)}
  }
  return{start,stop};
})();

const IDLE=(()=>{
  const B=document.body,vizOn=()=>!$('fs').hidden&&$('stage').classList.contains('v');
  let ms=120000,tm=0,on=false,cur=null,prev=null,fxc=null,rot=0,rm=0,ri=0,sp=1,lx=-1,ly=-1,lt=0;
  const setM=v=>{rm=v;RS.setProperty('--m',v.toFixed(3))};
  const ramp=(to,dur,done)=>{clearInterval(ri);const from=rm,t0=performance.now();
    ri=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/dur);setM(from+(to-from)*k);if(k>=1){clearInterval(ri);ri=0;done&&done()}},dur>5000?250:40)};
  const pick=l=>{const a=l.filter(x=>x!==prev);return a[Math.random()*a.length|0]};
  const SPD={melt:10,pixel:10,lsd:10,rgb:5},pool=()=>['melt','pixel','lsd','rgb'],inList=()=>$('fs').hidden;let forceSp=0;
  function begin(name){
    cur=prev=name;sp=forceSp||SPD[name];
    if(name=='melt'||name=='lsd'){B.classList.remove('fx-melt','fx-lsd');fxc=name;B.classList.add('fx-'+name);setM(0);ramp(1,(name=='melt'?50000:40000)/sp)}
    else if(name=='rgb')rgbStart(2200/sp,[document.querySelector('header'),$('list')]);
    else PXL.start(sp).then(ok=>{if(!ok&&on&&cur=='pixel'){cur=null;begin(pick(['melt','lsd','rgb']))}});
  }
  function end(fast,done){
    const c=cur;cur=null;clearTimeout(rot);
    if(c=='rgb')rgbStop(false);else if(c=='pixel')PXL.stop();
    if(fxc){const k=fxc;ramp(0,fast?450:1600,()=>{if(fxc===k){B.classList.remove('fx-'+k);fxc=null;RS.removeProperty('--m')}done&&done()})}
    else done&&done();
  }
  const arm=()=>{clearTimeout(tm);tm=setTimeout(go,ms)};
  function go(){if(document.hidden||!inList()){arm();return}on=true;begin(pick(pool()))}
  function off(){on=false;end(true)}
  function act(e){
    if(e&&e.type=='pointermove'&&Math.hypot(e.clientX-lx,e.clientY-ly)<3)return;
    if(e&&e.clientX!=null){lx=e.clientX;ly=e.clientY}
    const n=performance.now();if(!on&&n-lt<250)return;lt=n;
    if(on)off();arm();
  }
  ['pointerdown','pointermove','keydown','wheel','touchstart','touchmove','scroll','resize','orientationchange','input'].forEach(ev=>addEventListener(ev,act,{capture:true,passive:true}));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(on)off()}else act()});
  arm();
  return{force(n,s=0){forceSp=s;on=true;clearTimeout(tm);end(true,()=>begin(n))},get on(){return on},get cur(){return cur},setMs(v){ms=v;arm()}};
})();

/* ---------- Icono: bolita de un color distinto en cada carga ---------- */
try{
  const last=parseFloat(localStorage.getItem('favH'));let H=Math.random()*360;
  if(isFinite(last))H=(last+70+Math.random()*220)%360;
  try{localStorage.setItem('favH',H)}catch(e){}
  const mk=(n,bg)=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
    if(bg){x.fillStyle=bg;x.fillRect(0,0,n,n)}const r=n*(bg?.28:.42),q=x.createRadialGradient(n*.42,n*.38,r*.1,n/2,n/2,r);
    q.addColorStop(0,`hsl(${H},100%,87%)`);q.addColorStop(1,`hsl(${H},100%,65%)`);x.fillStyle=q;x.beginPath();x.arc(n/2,n/2,r,0,Math.PI*2);x.fill();return c.toDataURL('image/png')};
  document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.remove());
  const lk=(rel,href,sz)=>{const l=document.createElement('link');l.rel=rel;l.type='image/png';l.sizes=sz;l.href=href;document.head.appendChild(l)};
  lk('icon',mk(128),'128x128');lk('apple-touch-icon',mk(180,'#17171a'),'180x180');
}catch(e){}

/* ---------- Inicio ---------- */
setPP(false);sync();updTabs();syncFav();updOffLbl();
addEventListener('hashchange',()=>applyHash());
(async()=>{
  render();
  let local=[],srv=[];
  try{
    local=(await tx('readonly',s=>s.getAll()))||[];
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){}
  try{srv=await loadServer();toast(srv.length+' canciones en el servidor')}catch(e){toast('No se pudo cargar la biblioteca del servidor')}
  tracks=srv.concat(local);
  loading=false;
  await applySort();
  markCached();
  if(await applyHash())return;
  if(tracks.length){
    const id=localStorage.getItem('last');let i=tracks.findIndex(t=>String(t.id)==id);
    if(i<0)i=0;restore=+localStorage.getItem('pos')||0;
    await load(i,false,false);
  }else updateNow();
})();
